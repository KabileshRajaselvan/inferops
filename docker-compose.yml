services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inferops
      POSTGRES_PASSWORD: inferops
      POSTGRES_DB: inferops
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inferops -d inferops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node KRaft mode (no Zookeeper). CLUSTER_ID is a fixed pre-generated value - any
  # valid 22-char base64 UUID works, it just has to be present for `kafka-storage.sh format`.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9095:9095"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: T4foxApDQ-6bQi5M19xPkw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    ports:
      - "5050:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
      - mlflow_db:/mlflow/db
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/db/mlflow.db
      --default-artifact-root /mlflow/artifacts

  api:
    build: ./backend
    ports:
      - "8010:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://inferops:inferops@postgres:5432/inferops
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_ARTIFACT_DIR: /app/model-artifacts
      CORS_ORIGINS: http://localhost:5183
    volumes:
      - ./model-artifacts:/app/model-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  consumer:
    build: ./backend
    command: python -m app.consumer
    environment:
      DATABASE_URL: postgresql+psycopg://inferops:inferops@postgres:5432/inferops
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  evaluator:
    build: ./backend
    command: python -m app.evaluator
    ports:
      - "9101:9100"
    environment:
      DATABASE_URL: postgresql+psycopg://inferops:inferops@postgres:5432/inferops
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_ARTIFACT_DIR: /app/model-artifacts
    volumes:
      - ./model-artifacts:/app/model-artifacts
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8010}
    ports:
      - "5183:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
      - evaluator

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mlflow_artifacts:
  mlflow_db:
